name: Publicar Execution Environments

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  ORG: mikroways

jobs:
  build-public:
    name: Imagen pública (vm-setup)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5

      - name: Instalar dependencias
        run: uv sync

      - name: Build
        run: |
          uv run ansible-builder build \
            --container-runtime docker \
            -c ansible-builder \
            -f ansible-builder/execution-environment.yml \
            -t ${{ env.REGISTRY }}/${{ env.ORG }}/vm-setup:${{ github.ref_name }} \
            -t ${{ env.REGISTRY }}/${{ env.ORG }}/vm-setup:latest

      - name: Push
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.ORG }}/vm-setup:${{ github.ref_name }}
          docker push ${{ env.REGISTRY }}/${{ env.ORG }}/vm-setup:latest

  build-mw:
    name: Imagen privada MW (vm-setup-mw)
    # Deshabilitado hasta confirmar permisos para packages privados en la org
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5

      - name: Instalar dependencias
        run: uv sync

      - name: Setup clave SSH GitLab
        run: |
          echo "${{ secrets.GITLAB_SSH_KEY }}" > /tmp/gitlab_key
          chmod 600 /tmp/gitlab_key

      - name: Build
        env:
          DOCKER_BUILDKIT: 1
        run: |
          uv run ansible-builder build \
            --container-runtime docker \
            -c ansible-builder \
            -f ansible-builder/execution-environment-mw.yml \
            -t ${{ env.REGISTRY }}/${{ env.ORG }}/vm-setup-mw:${{ github.ref_name }} \
            -t ${{ env.REGISTRY }}/${{ env.ORG }}/vm-setup-mw:latest \
            --extra-build-cli-args="--secret id=ssh_key,src=/tmp/gitlab_key"

      - name: Push
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.ORG }}/vm-setup-mw:${{ github.ref_name }}
          docker push ${{ env.REGISTRY }}/${{ env.ORG }}/vm-setup-mw:latest

      - name: Limpiar clave SSH
        if: always()
        run: rm -f /tmp/gitlab_key
